name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate the sample dataset
        run: python generate_sample_dataset.py
      - name: Build embeddings, index, and classifier
        run: |
          python -m src.extract_embeddings
          python -m src.build_faiss_index
          python -m src.train_classifier
      - name: Smoke-test the CLI entry point
        run: python -m src.query_similar_images --query data/raw/crack_0.jpg --top_k 3
      - name: Smoke-test the REST API
        run: |
          uvicorn api.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/health | grep '"classifier_ready":true'
          curl -sf -X POST "http://127.0.0.1:8000/api/search?top_k=3" -F "file=@data/raw/crack_0.jpg" | grep crack_0.jpg
          curl -sf -X POST "http://127.0.0.1:8000/api/classify?top_k=2" -F "file=@data/raw/crack_0.jpg" | grep predicted_label

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
